<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <title>Dark Souls 2: Scholar of the First Sin Cheat Sheet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0f14">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230c0f14'%20stroke='%23c89b3c'%20stroke-width='2'/%3E%3Ctext%20x='32'%20y='42'%20font-size='40'%20fill='%23c89b3c'%20text-anchor='middle'%20font-weight='bold'%20font-family='serif'%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta name="description" content="Cheat sheet for Dark Souls 2: Scholar of the First Sin. Checklist of things to do, items to get etc.">
    <meta name="author" content="Xenevel">
	<link id="bootstrap" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="css/bootstrap-responsive.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <!--[if lt IE 9]>
        <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/jstorage.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
    <script type="text/javascript">
        var profilesKey = 'ds2_profiles';
    </script>
    <script src="js/store.js"></script>
    <script src="js/main.js"></script>
    <script src="js/backup.js"></script>
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container">
                
                    
            <ul class="nav navbar-nav">
                <li class="active"><a href="#tabPlaythrough" data-toggle="tab">Playthrough</a></li>
                <li><a href="#tabChecklists" data-toggle="tab">Checklists</a></li>
                <li><a href="#tabInformation" data-toggle="tab">Information</a></li>
                <li><a href="#tabHelp" data-toggle="tab">Help</a></li>
            </ul>
                <div class="profile">
                    <div class="input-append">
                        <select id="profiles">
                        </select>
                        <button class="btn" type="button" id="profileAdd">Add</button>
                        <button class="btn" type="button" id="profileEdit">Edit</button>
                        <button class="btn" type="button" id="backupOpen" title="Save your checkmarks to a file, or load one on another device">Backup</button>
                    </div>
                </div>
                    
                
        </div>
    </nav>

    <div class="container">
        <div id="intro">
            <h1 class="text-center">Dark Souls 2: Scholar of the First Sin Cheat Sheet</h1>

        </div>

        <div class="tab-content">

            <div class="toolbar">
                <div class="btn-group toolbar-actions" role="group">
		        <div class="btn-group" role="group" data-toggle="buttons">
		          <label class="btn btn-default toolbar-label">
                    <input type="checkbox" id="toggleHideCompleted">
                    <span class="glyphicon glyphicon-eye-close"></span>
                    <span class="glyphicon glyphicon-eye-open"></span>
                    Hide Completed
                </label>
		        </div>
                <div class="btn-group" role="group" data-toggle="buttons">
		          <label class="btn btn-default toolbar-label">
		            <input type="checkbox" id="toggleCollapseAll">
                    <span class="glyphicon glyphicon-chevron-up"></span>
                    <span class="glyphicon glyphicon-chevron-down"></span>
                    Collapse All
		          </label>
		        </div>
	        </div>
        	
                <span class="overall-progress">
                    <span class="overall-label">Overall Progress</span>
                    <span class="badge-overall" id="overallProgressPill"></span>
                </span>

                <div class="search-wrap toolbar-divider">
                    <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                    <input type="search" id="itemSearch" class="search-input" placeholder="Search all items&hellip;" autocomplete="off" aria-label="Search checklist items">
                    <span id="filterCount" class="search-count"></span>
                </div>

                <div class="chip-row toolbar-divider" id="chipRow">
                    <span class="chip-label">Filter</span>
                    <button type="button" class="tag-badge chip-badge tag-boss" data-tag="boss" title="Boss &mdash; boss encounters">Boss</button>
                    <button type="button" class="tag-badge chip-badge tag-bonfire" data-tag="bonfire" title="Bonfire &mdash; light and rest points">Bonfire</button>
                    <button type="button" class="tag-badge chip-badge tag-npc" data-tag="npc" title="NPC &mdash; dialogue and merchants">NPC</button>
                    <button type="button" class="tag-badge chip-badge tag-estus" data-tag="estus" title="Estus &mdash; flask shards and upgrades">Estus</button>
                    <button type="button" class="tag-badge chip-badge tag-key" data-tag="key" title="Key &mdash; progression keys">Key</button>
                    <button type="button" class="tag-badge chip-badge tag-branch" data-tag="branch" title="Branch &mdash; Fragrant Branch of Yore">Branch</button>
                    <button type="button" class="tag-badge chip-badge tag-lockstone" data-tag="lockstone" title="Lockstone &mdash; Pharros Lockstone">Lockstone</button>
                    <button type="button" class="tag-badge chip-badge tag-vessel" data-tag="vessel" title="Soul Vessel &mdash; stat reallocation">Soul Vessel</button>
                    <button type="button" class="tag-badge chip-badge tag-ascetic" data-tag="ascetic" title="Ascetic &mdash; Bonfire Ascetic">Ascetic</button>
                    <button type="button" class="tag-badge chip-badge tag-covenant" data-tag="covenant" title="Covenant &mdash; covenant joining">Covenant</button>
                    <button type="button" class="tag-badge chip-badge tag-gesture" data-tag="gesture" title="Gesture &mdash; gestures learned">Gesture</button>
                    <button type="button" class="tag-badge chip-badge tag-secret" data-tag="secret" title="Secret &mdash; illusory walls and hidden doors">Secret</button>
                    <button type="button" class="tag-badge chip-badge tag-memory" data-tag="memory" title="Memory &mdash; giant and king memories">Memory</button>
                    <button type="button" class="chip-clear" id="clearFilters">Clear</button>
                </div>
            </div>

            <div class="tab-pane active" id="tabPlaythrough">

                <h2>Playthrough Checklist <span id="playthrough_overall_total"></span></h2>
                <ul class="table_of_contents">
                    <li><a href="#Things_Betwixt">Things Betwixt</a> <span id="playthrough_nav_totals_1"></span></li>
                </ul>

                <hr />

            
                <h3 id="Things_Betwixt">Things Betwixt</h3>
                <ul id="Things_Betwixt_col" class="panel-collapse collapse in">
                    <li>Content continues as normal...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Back to top button - added to fix GitHub Pages display issue -->
    <button class="btn fadingbutton back-to-top" title="Back to top">↑</button>
</body>
</html>
